<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online Multiplayer Mini Militia 1v1</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background: #4a752c;
            border: 2px solid #fff;
            max-width: 100%;
            height: auto;
        }
        .instructions {
            margin: 5px 0;
            font-size: 12px;
            text-align: center;
            background: #222;
            padding: 5px 10px;
            border-radius: 5px;
        }
        /* Mobile Touch Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 10px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .game-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 10px;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="instructions" id="infoText">Connecting to server...</div>

    <!-- On-Screen Touch Buttons for Mobile -->
    <div class="controls">
        <div class="btn-group">
            <button class="game-btn" id="leftBtn">⬅️</button>
            <button class="game-btn" id="rightBtn">➡️</button>
        </div>
        <div class="btn-group">
            <button class="game-btn" id="jetBtn">🚀 Jet</button>
            <button class="game-btn" id="shootBtn">🔥 Shoot</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const infoText = document.getElementById("infoText");

        let myRole = null;
        let playersList = {};
        let bullets = [];
        const keys = {};

        // Keyboard Support
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        // Touch Button Support for Mobile
        function bindTouch(id, keyCode) {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyCode] = true; });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyCode] = false; });
            btn.addEventListener("mousedown", () => keys[keyCode] = true);
            btn.addEventListener("mouseup", () => keys[keyCode] = false);
        }

        bindTouch("leftBtn", "KeyA");
        bindTouch("rightBtn", "KeyD");
        bindTouch("jetBtn", "KeyW");
        bindTouch("shootBtn", "Space");

        socket.on('assigned', (role) => {
            myRole = role;
            infoText.innerHTML = `You are <strong>Player (${role.toUpperCase()})</strong>. Use screen buttons to play!`;
        });

        socket.on('full', () => {
            infoText.innerText = "Room is full! Only 2 players allowed.";
        });

        socket.on('currentPlayers', (serverPlayers) => {
            playersList = serverPlayers;
        });

        socket.on('enemyShoot', (b) => {
            bullets.push(b);
        });

        let myData = { x: 100, y: 280, vx: 0, vy: 0, speed: 3, gravity: 0.3, jumpPower: -6, health: 100, fuel: 100, facing: 1, width: 24, height: 36, isDead: false };

        function updateMyPlayer() {
            if (myRole && playersList[socket.id]) {
                let p = playersList[socket.id];
                myData.x = p.x;
                myData.y = p.y;
                myData.health = p.health;
                myData.fuel = p.fuel;
            }

            if (myData.isDead) return;

            if (keys["KeyA"]) {
                myData.vx = -myData.speed;
                myData.facing = -1;
            } else if (keys["KeyD"]) {
                myData.vx = myData.speed;
                myData.facing = 1;
            } else {
                myData.vx *= 0.8;
            }

            if (keys["KeyW"] && myData.fuel > 0) {
                myData.vy += myData.jumpPower * 0.35;
                myData.fuel = Math.max(0, myData.fuel - 0.8);
            } else {
                myData.vy += myData.gravity;
                if (myData.y >= 330 && myData.fuel < 100) {
                    myData.fuel = Math.min(100, myData.fuel + 0.4);
                }
            }

            myData.x += myData.vx;
            myData.y += myData.vy;

            if (myData.y > 330) {
                myData.y = 330;
                myData.vy = 0;
            }
            if (myData.x < 0) myData.x = 0;
            if (myData.x > canvas.width - myData.width) myData.x = canvas.width - myData.width;

            if (myRole) {
                socket.emit('playerData', {
                    x: myData.x,
                    y: myData.y,
                    health: myData.health,
                    fuel: myData.fuel,
                    facing: myData.facing
                });
            }
        }

        let lastShot = 0;
        function handleShooting() {
            let now = Date.now();
            if (keys["Space"] && now - lastShot > 250 && !myData.isDead) {
                let bx = myData.facing === 1 ? myData.x + myData.width + 5 : myData.x - 10;
                let by = myData.y + 14;
                let bvx = myData.facing * 10;
                
                bullets.push({ x: bx, y: by, vx: bvx, active: true });
                socket.emit('shoot', { x: bx, y: by, vx: bvx, active: true });
                lastShot = now;
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = "#35521e";
            ctx.fillRect(0, 366, canvas.width, 34);

            updateMyPlayer();
            handleShooting();

            bullets.forEach(b => {
                b.x += b.vx;
                if (b.x < 0 || b.x > canvas.width) b.active = false;
            });
            bullets = bullets.filter(b => b.active);

            bullets.forEach(b => {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(b.x, b.y, 6, 3);
            });

            for (let id in playersList) {
                let p = playersList[id];
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 24, 36);

                ctx.fillStyle = "#333";
                ctx.fillRect(p.x + (p.facing === 1 ? 8 : -2), p.y - 8, 16, 14);

                let gunX = p.facing === 1 ? p.x + 24 : p.x - 12;
                ctx.fillRect(gunX, p.y + 12, 14, 6);

                ctx.fillStyle = "red";
                ctx.fillRect(p.x - 10, p.y - 22, 44, 6);
                ctx.fillStyle = "lime";
                ctx.fillRect(p.x - 10, p.y - 22, (p.health / 100) * 44, 6);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
